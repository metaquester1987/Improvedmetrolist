name: Build Personal APK
run-name: Personal APK build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Unpack Metrolist source
        run: |
          mkdir source
          cat metrolist-source.zip.part-* > metrolist-source.zip
          unzip -tq metrolist-source.zip
          unzip -q metrolist-source.zip -d source

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare Android debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build FOSS debug APK
        run: |
          cd source
          chmod +x gradlew
          ./gradlew --console=plain :app:assembleFossDebug --warning-mode summary

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: metrolist-foss-debug
          path: source/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
