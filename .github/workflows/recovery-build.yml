name: Recovery APK build
run-name: Recovery source APK build

on:
  push:
    branches:
      - recovery/source-reconstruction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out recovery repository
        uses: actions/checkout@v6

      - name: Check out Metrolist 13.6.3 baseline
        uses: actions/checkout@v6
        with:
          repository: MetrolistGroup/Metrolist
          ref: 79367c1d012c4bd7ff7b958347bc449a32bd2c9a
          path: source

      - name: Overlay reconstructed files
        shell: bash
        run: |
          if [[ -d recovery-overlay ]]; then
            cp -a recovery-overlay/. source/
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: improved-metrolist-debug-keystore-v1

      - name: Prepare Android debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build FOSS debug APK
        run: |
          cd source
          chmod +x gradlew
          ./gradlew --console=plain :app:assembleFossDebug --warning-mode summary

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: improved-metrolist-recovery-foss-debug
          path: source/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
