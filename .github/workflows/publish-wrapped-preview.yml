name: Publish Wrapped Preview APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-wrapped-preview.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful preview artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36432062258 \
            --repo "${{ github.repository }}" \
            --name metrolist-foss-debug \
            --dir preview
          apk_path="$(find preview -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          mv "$apk_path" Metrolist-Improved-Wrapped-Preview.apk

      - name: Publish stable download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="wrapped-preview-2026-09-28"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" Metrolist-Improved-Wrapped-Preview.apk \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "$tag" Metrolist-Improved-Wrapped-Preview.apk \
              --repo "${{ github.repository }}" \
              --title "Metrolist Wrapped Preview" \
              --notes "Unlocked preview build with year-to-year comparisons and listening identity."
          fi
